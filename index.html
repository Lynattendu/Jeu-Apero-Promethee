<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<TITLE>JEU APERO PROMÉTHÉE </TITLE>

<style>
.carte-container {
width: 140px;
height: 210px;
display: inline-block;
margin: 8px;
perspective: 1000px;
}

.carte-flip {
width: 100%;
height: 100%;
position: relative;
transition: transform 0.25s ease;
}

.carte-face {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
border-radius: 12px;
object-fit: cover;
}

.carte-face-avant {
display: none;
}

.carte-flip.retournee .carte-face:first-child {
display: none;
}

.carte-flip.retournee .carte-face-avant {
display: block;
}

.carte-flip.animation {
transform: scaleX(0.05);
}

body {
margin: 0;
font-family: Arial, sans-serif;
background:
radial-gradient(circle at top, rgba(255, 140, 0, 0.18), transparent 35%),
radial-gradient(circle at bottom, rgba(0, 170, 255, 0.12), transparent 40%),
linear-gradient(180deg, #0b1020, #111827 55%, #090d18);
color: white;
min-height: 100vh;
}

#accueil {
min-height: 100vh;
box-sizing: border-box;
padding: 50px 20px 35px;
text-align: center;
}

#accueil h1 {
margin: 20px 0 8px;
font-size: clamp(32px, 9vw, 56px);
line-height: 1.05;
letter-spacing: 2px;
color: #ffffff;
text-shadow:
0 0 8px rgba(255, 170, 40, 0.9),
0 0 20px rgba(255, 120, 0, 0.55);
}

#accueil p {
margin: 15px 0 35px;
font-size: 18px;
color: #d9e3f0;
}

.bouton-accueil {
display: block;
width: min(90%, 430px);
min-height: 110px;
margin: 18px auto;
padding: 20px;
border: 1px solid rgba(255,255,255,0.25);
border-radius: 24px;

background:
linear-gradient(
135deg,
rgba(255, 135, 20, 0.95),
rgba(137, 63, 255, 0.88)
);

color: white;
font-size: 23px;
font-weight: bold;
letter-spacing: 0.5px;

box-shadow:
0 10px 30px rgba(0,0,0,0.35),
0 0 18px rgba(255,140,40,0.20);

cursor: pointer;
transition:
transform 0.18s ease,
box-shadow 0.18s ease;
}

.bouton-accueil:active {
transform: scale(0.97);
}

.bouton-accueil span {
display: block;
margin-top: 8px;
font-size: 14px;
font-weight: normal;
opacity: 0.85;
}

#rapide {
min-height: 100vh;
box-sizing: border-box;
padding: 30px 18px 40px;
text-align: center;
}

#rapide h1 {
margin: 10px 0 10px;
font-size: clamp(28px, 7vw, 46px);
color: #ffffff;
text-shadow:
0 0 8px rgba(0, 200, 255, 0.35),
0 0 18px rgba(255, 140, 0, 0.25);
}

#rapide p {
margin-bottom: 26px;
color: #d9e3f0;
font-size: 17px;
}

.bouton-famille {
display: block;
width: min(92%, 430px);
margin: 14px auto;
padding: 18px 20px;

border: 1px solid rgba(255,255,255,0.18);
border-radius: 20px;

background:
linear-gradient(
135deg,
rgba(19, 31, 57, 0.95),
rgba(43, 21, 84, 0.92)
);

color: white;
font-size: 21px;
font-weight: bold;
text-align: center;

box-shadow:
0 8px 24px rgba(0,0,0,0.32),
0 0 14px rgba(0, 180, 255, 0.10);

cursor: pointer;
transition:
transform 0.18s ease,
box-shadow 0.18s ease,
border-color 0.18s ease;
}

.bouton-famille:active {
transform: scale(0.97);
}

.bouton-famille:hover {
border-color: rgba(255, 166, 0, 0.45);
box-shadow:
0 10px 26px rgba(0,0,0,0.36),
0 0 18px rgba(255, 140, 0, 0.18);
}

.bouton-retour {
margin-top: 24px;
padding: 14px 22px;
border: none;
border-radius: 18px;

background: rgba(255,255,255,0.10);
color: white;
font-size: 17px;
font-weight: bold;
}

.ecran-jeu {
min-height: 100vh;
box-sizing: border-box;
padding: 30px 18px 40px;
text-align: center;
}

.ecran-jeu h1 {
margin: 10px 0 12px;
font-size: clamp(28px, 7vw, 46px);
color: white;
text-shadow:
0 0 8px rgba(0, 200, 255, 0.28),
0 0 18px rgba(255, 140, 0, 0.22);
}

.ecran-jeu p {
color: #d9e3f0;
font-size: 17px;
}

.bouton-principal:active {
transform: scale(0.97);
}

#zoneCartes {
display: grid;
grid-template-columns: repeat(3, 140px);
gap: 16px;
justify-content: center;
margin: 25px auto;
}

@media (max-width: 500px) {

.carte-container {
width: 105px;
height: 158px;
margin: 0;
}

#zoneCartes {
grid-template-columns: repeat(3, 105px);
gap: 10px;
}

}

.carte-selectionnee {
width: min(78vw, 360px);
height: auto;
aspect-ratio: 2 / 3;
margin: 25px auto;
}

.carte-selectionnee img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 18px;
}
  
</style>


<body>

<!-- ÉCRAN D'ACCUEIL -->
<div id="accueil">

<h1>🔥 JEU APERO PROMÉTHÉE</h1>

<p>le principe est simple: 
  dessiner la carte choisis. 
  dans le temps defini.
  </p>

<button class="bouton-accueil" onclick="ouvrirRapide()">
    ⚡ L’ÉTINCELLE
<span> Dessinez en 30 secondes max</span>
</button>

<button class="bouton-accueil" onclick="ouvrirApprofondi()">
    🔥 LA FLAMME
<span>Prenez jusqu’à 1 min 30 pour dessiner</span>
</button>

</div>


<!-- ⚡ L’ÉTINCELLE -->
<div id="rapide" style="display:none;">

<h1>JEU APERO PROMÉTHÉE, PRÊT A DESSINER, DESSINEZ </h1>

<p>Choisis une famille</p>
<button class="bouton-famille" onclick="ouvrirFamille('Rêves Secrets')">
Rêves Secrets
</button>

<button class="bouton-famille" onclick="ouvrirFamille('Révélateur de l Apéro')">
Révélateur de l'Apéro
</button>

<button class="bouton-famille" onclick="ouvrirFamille('Les Pouvoirs Cachés')">
Les Pouvoirs Cachés
</button>

<button class="bouton-famille" onclick="ouvrirFamille('Les Faux Secrets')">
Les Faux Secrets
</button>

<button class="bouton-famille" onclick="ouvrirFamille('Les Habitudes Honteuses')">
Les Habitudes Honteuses
</button>

<button class="bouton-famille" onclick="ouvrirFamille('Les Experts en Amour')">
  Les Expert en Amour
</button>

<button class="bouton-famille" onclick="ouvrirFamille('C est Fait')">
C'est Fait
</button>

  <button class="bouton-famille" onclick="ouvrirFamille('Toutes')">
🌈 TOUTES LES FAMILLES
</button>

<br><br>

<button class="bouton-retour" onclick="retourAccueil()">
← Retour
</button>
</div>


<!-- ÉCRAN CHOIX D'UNE CARTE -->
<div id="tirage" class="ecran-jeu" style="display:none;">

<h1 id="titreTirage">🔥 CHOISIS UNE CARTE</h1>

<p id="infoTirage"></p>

<div id="zoneCartes"></div>

<br>

<button class="bouton-retour" onclick="retourFamilles()">
← Retour aux familles
</button>

</div>



  
<script>

let modeJeu = "";
let familleChoisie = "";


const dosFamilles = {
"Rêves Secrets": "Image/Dos/Dos-RS.PNG",
"Révélateur de l Apéro": "Image/Dos/Dos-RA.PNG",
"Les Pouvoirs Cachés": "Image/Dos/Dos-PC.PNG",
"Les Faux Secrets": "Image/Dos/Dos-FS.PNG",
"Les Habitudes Honteuses": "Image/Dos/Dos-HH.PNG",
"Les Experts en Amour": "Image/Dos/Dos-EA.PNG",
"C est Fait": "Image/Dos/Dos-CF.PNG",
"Toutes": "Image/Dos/Dos-Toutes.PNG"
};



  
function ouvrirRapide() {
modeJeu = "rapide";

document.getElementById("accueil").style.display = "none";
document.getElementById("rapide").style.display = "block";
}

function ouvrirApprofondi() {
modeJeu = "approfondi";

document.getElementById("accueil").style.display = "none";
document.getElementById("rapide").style.display = "block";
}

function ouvrirFamille(famille) {

familleChoisie = famille;

document.getElementById("rapide").style.display = "none";
document.getElementById("tirage").style.display = "block";

document.getElementById("infoTirage").textContent =
(familleChoisie === "Toutes" ? "Toutes les familles" : familleChoisie) +
" • " +
(modeJeu === "rapide" ? "30 secondes" : "1 min 30");

afficherSixCartes();

}

function afficherSixCartes() {

const zone = document.getElementById("zoneCartes");
zone.innerHTML = "";

// Pour l'instant seules RS et RA sont prêtes
if (
familleChoisie !== "Rêves Secrets" &&
familleChoisie !== "Révélateur de l Apéro"
) {

zone.innerHTML = `
<p>🔥 Cette famille sera disponible dès que ses cartes seront renommées.</p>
`;

return;
}


// ----------------------
// RÊVES SECRETS
// ----------------------

let codeFamille = "";
let debut = 0;
let fin = 0;

if (familleChoisie === "Rêves Secrets") {

codeFamille = "RS";

if (modeJeu === "rapide") {
debut = 1;
fin = 40;
} else {
debut = 50;
fin = 98;
}

}


// ----------------------
// RÉVÉLATEUR DE L'APÉRO
// ----------------------

if (familleChoisie === "Révélateur de l Apéro") {

codeFamille = "RA";

if (modeJeu === "rapide") {
debut = 1;
fin = 80;
} else {
debut = 100;
fin = 157;
}

}


// ----------------------
// CHOISIR 6 CARTES DIFFÉRENTES
// ----------------------

const numerosChoisis = [];

while (numerosChoisis.length < 6) {

const numero =
Math.floor(Math.random() * (fin - debut + 1)) + debut;

if (!numerosChoisis.includes(numero)) {
numerosChoisis.push(numero);
}

}


// ----------------------
// CRÉER LES 6 CARTES
// ----------------------

numerosChoisis.forEach(numero => {

const numeroTexte =
numero.toString().padStart(2, "0");

const devant =
`image/Famille/${codeFamille}/${codeFamille}-${numeroTexte}.PNG`;

const dos =
dosFamilles[familleChoisie];

const container =
document.createElement("div");

container.className = "carte-container";

const flip =
document.createElement("div");

flip.className = "carte-flip";

flip.innerHTML = `

<img
src="${dos}"
class="carte-face"
alt="Dos de carte"
>

<img
src="${devant}"
class="carte-face carte-face-avant"
alt="Carte ${codeFamille}-${numeroTexte}"
>

`;

flip.onclick = function() {

if (flip.classList.contains("retournee")) {
return;
}

flip.classList.add("animation");

setTimeout(function() {

zone.innerHTML = "";

const grandeCarte = document.createElement("div");
grandeCarte.className = "carte-selectionnee";

grandeCarte.innerHTML = `
<img
src="${devant}"
alt="Carte ${codeFamille}-${numeroTexte}"
>
`;

zone.appendChild(grandeCarte);

}, 250);

};

container.appendChild(flip);
zone.appendChild(container);

});

}


  
  function retourFamilles() {

document.getElementById("tirage").style.display = "none";
document.getElementById("rapide").style.display = "block";

familleChoisie = "";

}

function retourAccueil() {
document.getElementById("rapide").style.display = "none";
document.getElementById("accueil").style.display = "block";

modeJeu = "";
familleChoisie = "";
}




  
</script>


</body>

</html>
